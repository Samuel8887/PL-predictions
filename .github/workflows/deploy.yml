name: Validate, build and deploy predictions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: node --check site/app.js
      - run: npm test
      - run: python scripts/import_data.py --supplement-current
      - run: python scripts/import_player_data.py
      - run: python scripts/train_predict.py
      - run: python scripts/validation.py
      - run: python scripts/audit_data.py
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: |
            artifacts/browser
            site/data/evaluation.json
            site/data/data_quality.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
